<!DOCTYPE html>
<html class="light" lang="vi">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Đăng nhập - VELOCITY PRIME</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Inter:wght@400;500;600;700&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css" rel="stylesheet"/>
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "on-primary": "#ffffff",
            "surface-container-highest": "#e2e2e2",
            "on-tertiary-fixed-variant": "#454747",
            "surface-bright": "#ffffff",
            "on-tertiary-fixed": "#1a1c1c",
            "secondary-fixed-dim": "#c6c6c6",
            "surface-container": "#f5f5f5",
            "surface-container-lowest": "#ffffff",
            "primary-fixed-dim": "#ffb3af",
            "surface-dim": "#f5f5f5",
            "tertiary": "#474747",
            "on-primary-fixed-variant": "#930017",
            "surface-container-low": "#fafafa",
            "on-error": "#ffffff",
            "on-secondary-container": "#1b1b1b",
            "outline-variant": "#d8c2c0",
            "error-container": "#f9dedc",
            "surface-variant": "#f1dedd",
            "error": "#b3261e",
            "on-secondary-fixed": "#1b1b1b",
            "inverse-primary": "#ffb3af",
            "on-primary-container": "#410005",
            "tertiary-fixed-dim": "#c6c6c7",
            "inverse-surface": "#313030",
            "secondary": "#5e5e5e",
            "outline": "#857372",
            "primary-container": "#ffdad7",
            "on-tertiary-container": "#282a2a",
            "surface-tint": "#c00021",
            "primary-fixed": "#ffdad7",
            "inverse-on-surface": "#f5f0ef",
            "on-primary-fixed": "#410005",
            "on-secondary-fixed-variant": "#474747",
            "on-error-container": "#410002",
            "primary": "#c00021",
            "tertiary-container": "#909191",
            "on-background": "#1c1b1b",
            "background": "#ffffff",
            "secondary-fixed": "#e2e2e2",
            "surface": "#ffffff",
            "on-tertiary": "#ffffff",
            "on-surface": "#1c1b1b",
            "tertiary-fixed": "#e2e2e2",
            "secondary-container": "#e2e2e2",
            "on-surface-variant": "#534342",
            "on-secondary": "#ffffff",
            "surface-container-high": "#ebebeb"
          },
          borderRadius: { DEFAULT: "0.25rem", lg: "0.5rem", xl: "0.75rem", full: "9999px" },
          spacing: { "section-gap": "120px", "margin-mobile": "20px", unit: "4px", "margin-desktop": "64px", gutter: "24px" },
          fontFamily: {
            "headline-lg": ["Oswald"], "label-bold": ["Inter"], "headline-lg-mobile": ["Oswald"],
            "body-md": ["Inter"], "stats-display": ["Oswald"], "headline-md": ["Oswald"],
            "display-lg": ["Oswald"], "body-lg": ["Inter"]
          },
          fontSize: {
            "headline-lg": ["48px", { lineHeight: "1.1", letterSpacing: "-0.02em", fontWeight: "700" }],
            "label-bold": ["14px", { lineHeight: "1.0", letterSpacing: "0.1em", fontWeight: "700" }],
            "headline-lg-mobile": ["36px", { lineHeight: "1.1", fontWeight: "700" }],
            "body-md": ["16px", { lineHeight: "1.5", fontWeight: "400" }],
            "stats-display": ["24px", { lineHeight: "1.0", fontWeight: "700" }],
            "headline-md": ["32px", { lineHeight: "1.2", fontWeight: "600" }],
            "display-lg": ["84px", { lineHeight: "1.0", letterSpacing: "-0.04em", fontWeight: "700" }],
            "body-lg": ["18px", { lineHeight: "1.6", fontWeight: "400" }]
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="style.css"/>
</head>
<body class="bg-white text-on-background font-body-md">
  <div class="min-h-screen flex">
    <!-- Left: Background Image -->
    <div class="hidden lg:flex lg:w-1/2 bg-cover bg-center relative" style="background-image: url('https://images.unsplash.com/photo-1534438327276-14e5300c3a48?w=800&q=80'); background-position: center;">
      <div class="absolute inset-0 bg-gradient-to-r from-transparent via-transparent to-white opacity-30"></div>
    </div>

    <!-- Right: Form -->
    <div class="w-full lg:w-1/2 flex flex-col">
      <!-- Header -->
      <header class="bg-on-surface text-white py-4 px-margin-mobile md:px-margin-desktop flex items-center justify-between">
        <div class="flex items-center gap-2 cursor-pointer" onclick="window.history.back()">
          <span class="material-symbols-outlined">arrow_back</span>
          <span class="font-headline-md text-lg">VP PRIME</span>
        </div>
        <a href="index.html" class="material-symbols-outlined text-2xl hover:opacity-80">close</a>
      </header>

      <!-- Form Container -->
      <div class="flex-1 flex items-center justify-center px-margin-mobile md:px-margin-desktop py-12">
        <div class="max-w-md w-full">
          <!-- Tab Navigation -->
          <div class="flex gap-4 mb-8 border-b-2 border-outline-variant">
            <button class="pb-3 px-4 text-lg font-bold border-b-2 border-primary text-primary transition-colors" id="loginTab" onclick="switchLoginTab('login')">
              Đăng nhập
            </button>
            <button class="pb-3 px-4 text-lg font-bold border-b-2 border-transparent text-secondary hover:text-on-surface transition-colors" id="registerTab" onclick="switchLoginTab('register')">
              Đăng ký
            </button>
          </div>

          <!-- Login Form -->
          <div id="loginForm" class="space-y-4">
            <div>
              <label class="block text-sm font-bold text-on-surface mb-2">Email hoặc Số điện thoại</label>
              <input type="text" id="loginEmail" placeholder="Nhập email hoặc số điện thoại" 
                class="w-full px-4 py-3 border border-outline-variant rounded-lg text-sm outline-none focus:border-primary transition-colors bg-white"/>
            </div>
            <div>
              <label class="block text-sm font-bold text-on-surface mb-2">Mật khẩu</label>
              <input type="password" id="loginPassword" placeholder="Nhập mật khẩu" 
                class="w-full px-4 py-3 border border-outline-variant rounded-lg text-sm outline-none focus:border-primary transition-colors bg-white"/>
            </div>
            <div class="flex items-center justify-between text-sm">
              <label class="flex items-center gap-2 cursor-pointer">
                <input type="checkbox" class="w-4 h-4 accent-primary" id="rememberMe"/>
                <span class="text-secondary">Ghi nhớ tôi</span>
              </label>
              <a href="#" class="text-primary hover:underline">Quên mật khẩu?</a>
            </div>
            <button class="w-full py-3 bg-primary text-on-primary rounded-lg font-bold text-base hover:bg-surface-tint transition-colors flex items-center justify-center gap-2" onclick="handleLogin()">
              <span class="material-symbols-outlined text-lg">login</span> Đăng nhập
            </button>
            <p class="text-center text-sm text-secondary mt-4">Chưa có tài khoản? <span class="text-primary font-bold cursor-pointer" onclick="switchLoginTab('register')">Đăng ký ngay</span></p>
          </div>

          <!-- Register Form -->
          <div id="registerForm" style="display:none;" class="space-y-4">
            <div>
              <label class="block text-sm font-bold text-on-surface mb-2">Họ và tên</label>
              <input type="text" id="registerName" placeholder="Nhập họ và tên" 
                class="w-full px-4 py-3 border border-outline-variant rounded-lg text-sm outline-none focus:border-primary transition-colors bg-white"/>
              <span class="text-xs text-error hidden" id="nameError">Vui lòng nhập họ và tên.</span>
            </div>
            <div>
              <label class="block text-sm font-bold text-on-surface mb-2">Email</label>
              <input type="email" id="registerEmail" placeholder="Nhập email" 
                class="w-full px-4 py-3 border border-outline-variant rounded-lg text-sm outline-none focus:border-primary transition-colors bg-white"/>
              <span class="text-xs text-error hidden" id="emailError">Vui lòng nhập email.</span>
            </div>
            <div>
              <label class="block text-sm font-bold text-on-surface mb-2">Số điện thoại</label>
              <input type="tel" id="registerPhone" placeholder="Nhập số điện thoại" 
                class="w-full px-4 py-3 border border-outline-variant rounded-lg text-sm outline-none focus:border-primary transition-colors bg-white"/>
              <span class="text-xs text-error hidden" id="phoneError">Vui lòng nhập số điện thoại.</span>
            </div>
            <div>
              <label class="block text-sm font-bold text-on-surface mb-2">Mật khẩu</label>
              <input type="password" id="registerPassword" placeholder="Nhập mật khẩu (tối thiểu 6 ký tự)" 
                class="w-full px-4 py-3 border border-outline-variant rounded-lg text-sm outline-none focus:border-primary transition-colors bg-white"/>
              <span class="text-xs text-error hidden" id="passwordError">Mật khẩu phải có ít nhất 6 ký tự.</span>
            </div>
            <div>
              <label class="block text-sm font-bold text-on-surface mb-2">Xác nhận mật khẩu</label>
              <input type="password" id="registerPasswordConfirm" placeholder="Nhập lại mật khẩu" 
                class="w-full px-4 py-3 border border-outline-variant rounded-lg text-sm outline-none focus:border-primary transition-colors bg-white"/>
              <span class="text-xs text-error hidden" id="confirmError">Mật khẩu không khớp.</span>
            </div>
            <label class="flex items-center gap-2 cursor-pointer">
              <input type="checkbox" class="w-4 h-4 accent-primary" id="agreeTerms" required/>
              <span class="text-sm text-secondary">Tôi đồng ý với <span class="text-primary font-bold">Điều khoản sử dụng</span> và <span class="text-primary font-bold">Chính sách bảo mật</span></span>
            </label>
            <button class="w-full py-3 bg-primary text-on-primary rounded-lg font-bold text-base hover:bg-surface-tint transition-colors flex items-center justify-center gap-2" onclick="handleRegister()">
              <span class="material-symbols-outlined text-lg">person_add</span> Đăng ký
            </button>
            <p class="text-center text-sm text-secondary mt-4">Đã có tài khoản? <span class="text-primary font-bold cursor-pointer" onclick="switchLoginTab('login')">Đăng nhập ngay</span></p>
          </div>

          <!-- Social Login -->
          <div class="mt-8 pt-6 border-t border-outline-variant">
            <p class="text-center text-sm text-secondary mb-4">Hoặc đăng nhập bằng</p>
            <div class="grid grid-cols-2 gap-3">
              <button class="py-2.5 border border-outline-variant rounded-lg hover:border-primary transition-colors flex items-center justify-center gap-2 text-sm font-medium">
                <i class="ti ti-brand-google text-lg"></i> Google
              </button>
              <button class="py-2.5 border border-outline-variant rounded-lg hover:border-primary transition-colors flex items-center justify-center gap-2 text-sm font-medium">
                <i class="ti ti-brand-facebook text-lg"></i> Facebook
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"><i class="ti ti-check"></i><span id="toastMsg"></span></div>

  <script>
    function showToast(msg) {
      const t = document.getElementById('toast');
      document.getElementById('toastMsg').textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2800);
    }

    function switchLoginTab(tab) {
      const loginForm = document.getElementById('loginForm');
      const registerForm = document.getElementById('registerForm');
      const loginTab = document.getElementById('loginTab');
      const registerTab = document.getElementById('registerTab');
      
      if (tab === 'login') {
        loginForm.style.display = 'block';
        registerForm.style.display = 'none';
        loginTab.classList.add('border-primary', 'text-primary');
        loginTab.classList.remove('border-transparent', 'text-secondary');
        registerTab.classList.add('border-transparent', 'text-secondary');
        registerTab.classList.remove('border-primary', 'text-primary');
      } else {
        loginForm.style.display = 'none';
        registerForm.style.display = 'block';
        registerTab.classList.add('border-primary', 'text-primary');
        registerTab.classList.remove('border-transparent', 'text-secondary');
        loginTab.classList.add('border-transparent', 'text-secondary');
        loginTab.classList.remove('border-primary', 'text-primary');
      }
    }

    function handleLogin() {
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;
      
      if (!email || !password) {
        showToast('Vui lòng điền đầy đủ thông tin!');
        return;
      }
      
      // Save user info to localStorage
      const currentUser = {
        email: email,
        name: email.split('@')[0] || email,
        phone: '0912345678',
        address: '123 Cầu Giấy, Quận Cầu Giấy, Hà Nội'
      };
      localStorage.setItem('isLoggedIn', 'true');
      localStorage.setItem('currentUser', JSON.stringify(currentUser));
      
      showToast('Đăng nhập thành công!');
      
      // Redirect based on referrer or back to home
      setTimeout(() => {
        const referrer = sessionStorage.getItem('loginReferrer');
        if (referrer === 'checkout') {
          sessionStorage.removeItem('loginReferrer');
          window.location.href = 'checkout.html';
        } else {
          window.location.href = 'index.html';
        }
      }, 800);
    }

    function handleRegister() {
      const name = document.getElementById('registerName').value.trim();
      const email = document.getElementById('registerEmail').value.trim();
      const phone = document.getElementById('registerPhone').value.trim();
      const password = document.getElementById('registerPassword').value;
      const passwordConfirm = document.getElementById('registerPasswordConfirm').value;
      const agreeTerms = document.getElementById('agreeTerms').checked;
      
      // Hide all errors first
      document.querySelectorAll('[id$="Error"]').forEach(el => el.classList.add('hidden'));
      
      let isValid = true;
      
      if (!name) {
        document.getElementById('nameError').classList.remove('hidden');
        isValid = false;
      }
      
      if (!email) {
        document.getElementById('emailError').classList.remove('hidden');
        isValid = false;
      }
      
      if (!phone) {
        document.getElementById('phoneError').classList.remove('hidden');
        isValid = false;
      }
      
      if (password.length < 6) {
        document.getElementById('passwordError').classList.remove('hidden');
        isValid = false;
      }
      
      if (password !== passwordConfirm) {
        document.getElementById('confirmError').classList.remove('hidden');
        isValid = false;
      }
      
      if (!agreeTerms) {
        showToast('Vui lòng chấp nhận điều khoản!');
        return;
      }
      
      if (!isValid) return;
      
      // Register user
      const currentUser = { name, email, phone };
      localStorage.setItem('isLoggedIn', 'true');
      localStorage.setItem('currentUser', JSON.stringify(currentUser));
      
      showToast('Đăng ký thành công!');
      
      // Switch to login tab
      setTimeout(() => {
        switchLoginTab('login');
        document.getElementById('loginEmail').value = email;
        document.getElementById('loginPassword').value = '';
      }, 500);
    }
  </script>
</body>
</html>
