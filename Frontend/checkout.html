<!DOCTYPE html>
<html class="light" lang="vi">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Thanh toán - VELOCITY PRIME</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Inter:wght@400;500;600;700&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css"/>
</head>
<body class="bg-surface-container-low text-on-background font-body-md">
  <div class="min-h-screen flex flex-col">
    <!-- Header -->
    <header class="bg-on-surface text-white py-4 px-margin-mobile md:px-margin-desktop flex items-center justify-between">
      <div class="flex items-center gap-2 cursor-pointer" onclick="window.location.href='index.html'">
        <span class="material-symbols-outlined">arrow_back</span>
        <span class="font-headline-md text-lg">Thanh toán</span>
      </div>
      <div class="text-sm">Bước 1/3</div>
    </header>

    <!-- Main Content -->
    <div class="max-w-4xl mx-auto px-margin-mobile md:px-margin-desktop py-8 w-full flex-1">
      <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
        <!-- Left: Form -->
        <div class="lg:col-span-2 space-y-6">
          <!-- Thông tin giao hàng -->
          <div class="bg-white rounded-2xl p-6 md:p-8 shadow-sm">
            <h2 class="text-lg font-bold text-on-surface mb-6 flex items-center gap-2">
              <span class="material-symbols-outlined text-primary">local_shipping</span> Thông tin giao hàng
            </h2>
            <div class="space-y-4">
              <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                  <label class="block text-sm font-bold text-on-surface mb-2">Họ và tên</label>
                  <input type="text" id="checkoutName" placeholder="Nguyễn Văn A" 
                    class="w-full px-4 py-3 border border-outline-variant rounded-lg text-sm outline-none focus:border-primary transition-colors bg-white"/>
                </div>
                <div>
                  <label class="block text-sm font-bold text-on-surface mb-2">Số điện thoại</label>
                  <input type="tel" id="checkoutPhone" placeholder="0912 345 678" 
                    class="w-full px-4 py-3 border border-outline-variant rounded-lg text-sm outline-none focus:border-primary transition-colors bg-white"/>
                </div>
              </div>
              <div>
                <label class="block text-sm font-bold text-on-surface mb-2">Tỉnh/Thành phố</label>
                <select class="w-full px-4 py-3 border border-outline-variant rounded-lg text-sm outline-none focus:border-primary transition-colors bg-white">
                  <option>-- Chọn Tỉnh/Thành phố --</option>
                  <option>Hà Nội</option>
                  <option>Hồ Chí Minh</option>
                  <option>Đà Nẵng</option>
                </select>
              </div>
              <div class="grid grid-cols-2 gap-4">
                <div>
                  <label class="block text-sm font-bold text-on-surface mb-2">Quận/Huyện</label>
                  <select class="w-full px-4 py-3 border border-outline-variant rounded-lg text-sm outline-none focus:border-primary transition-colors bg-white">
                    <option>-- Chọn Quận/Huyện --</option>
                  </select>
                </div>
                <div>
                  <label class="block text-sm font-bold text-on-surface mb-2">Phường/Xã</label>
                  <select class="w-full px-4 py-3 border border-outline-variant rounded-lg text-sm outline-none focus:border-primary transition-colors bg-white">
                    <option>-- Chọn Phường/Xã --</option>
                  </select>
                </div>
              </div>
              <div>
                <label class="block text-sm font-bold text-on-surface mb-2">Địa chỉ chi tiết</label>
                <input type="text" id="checkoutAddress" placeholder="Số nhà, tên đường..." 
                  class="w-full px-4 py-3 border border-outline-variant rounded-lg text-sm outline-none focus:border-primary transition-colors bg-white"/>
              </div>
            </div>
          </div>

          <!-- Phương thức giao hàng -->
          <div class="bg-white rounded-2xl p-6 md:p-8 shadow-sm">
            <h2 class="text-lg font-bold text-on-surface mb-6 flex items-center gap-2">
              <span class="material-symbols-outlined text-primary">local_shipping</span> Phương thức giao hàng
            </h2>
            <div class="space-y-3">
              <label class="flex items-center gap-3 p-3 border-2 border-primary rounded-xl cursor-pointer bg-primary/5">
                <input type="radio" name="shipping" value="standard" checked class="w-5 h-5 accent-primary"/>
                <div class="flex-1">
                  <div class="font-semibold text-on-surface">Giao hàng tiêu chuẩn</div>
                  <div class="text-sm text-secondary">Giao trong 3-5 ngày (Miễn phí)</div>
                </div>
              </label>
              <label class="flex items-center gap-3 p-3 border-2 border-outline-variant rounded-xl cursor-pointer hover:border-primary transition-colors">
                <input type="radio" name="shipping" value="express" class="w-5 h-5 accent-primary"/>
                <div class="flex-1">
                  <div class="font-semibold text-on-surface">Giao hàng nhanh (Express)</div>
                  <div class="text-sm text-secondary">Giao trong 1-2 ngày (+30.000₫)</div>
                </div>
              </label>
            </div>
          </div>

          <!-- Phương thức thanh toán -->
          <div class="bg-white rounded-2xl p-6 md:p-8 shadow-sm">
            <h2 class="text-lg font-bold text-on-surface mb-6 flex items-center gap-2">
              <span class="material-symbols-outlined text-primary">payment</span> Phương thức thanh toán
            </h2>
            <div class="space-y-3">
              <label class="flex items-center gap-3 p-3 border-2 border-outline-variant rounded-xl cursor-pointer hover:border-primary transition-colors">
                <input type="radio" name="payment" value="cod" checked class="w-5 h-5 accent-primary"/>
                <div class="flex-1">
                  <div class="font-semibold text-on-surface">Thanh toán khi nhận hàng</div>
                  <div class="text-sm text-secondary">COD - Không phí thêm</div>
                </div>
              </label>
              <label class="flex items-center gap-3 p-3 border-2 border-outline-variant rounded-xl cursor-pointer hover:border-primary transition-colors">
                <input type="radio" name="payment" value="bank" class="w-5 h-5 accent-primary"/>
                <div class="flex-1">
                  <div class="font-semibold text-on-surface">Chuyển khoản ngân hàng</div>
                  <div class="text-sm text-secondary">QR Code - Hoàn tiền nếu lỗi</div>
                </div>
              </label>
              <label class="flex items-center gap-3 p-3 border-2 border-outline-variant rounded-xl cursor-pointer hover:border-primary transition-colors">
                <input type="radio" name="payment" value="ewallets" class="w-5 h-5 accent-primary"/>
                <div class="flex-1">
                  <div class="font-semibold text-on-surface">Ví điện tử</div>
                  <div class="text-sm text-secondary">Momo, ZaloPay, ViettelPay</div>
                </div>
              </label>
            </div>
          </div>
        </div>

        <!-- Right: Order Summary -->
        <div class="lg:col-span-1">
          <div class="bg-white rounded-2xl p-6 shadow-sm sticky top-24">
            <h2 class="text-lg font-bold text-on-surface mb-4">Đơn hàng của bạn</h2>
            <!-- Cart Items -->
            <div id="checkoutCartItems" class="space-y-3 mb-4 max-h-64 overflow-y-auto pb-4 border-b border-outline-variant">
              <!-- Populated dynamically -->
            </div>
            <!-- Promo Code -->
            <div class="mb-4">
              <div class="flex gap-2">
                <input type="text" id="promoCode" placeholder="Mã khuyến mãi" 
                  class="flex-1 px-3 py-2 border border-outline-variant rounded-lg text-xs outline-none focus:border-primary transition-colors bg-white"/>
                <button class="px-3 py-2 bg-primary/10 text-primary rounded-lg text-xs font-bold hover:bg-primary hover:text-white transition-colors">
                  Áp dụng
                </button>
              </div>
            </div>
            <!-- Price Summary -->
            <div class="space-y-2 mb-4 pb-4 border-b border-outline-variant text-sm">
              <div class="flex justify-between">
                <span class="text-secondary">Tạm tính</span>
                <span class="font-semibold text-on-surface" id="subtotal">0₫</span>
              </div>
              <div class="flex justify-between">
                <span class="text-secondary">Vận chuyển</span>
                <span class="font-semibold text-on-surface" id="shippingCost">Miễn phí</span>
              </div>
              <div class="flex justify-between">
                <span class="text-secondary">Giảm giá</span>
                <span class="font-semibold text-error" id="discountAmount">0₫</span>
              </div>
              <div class="flex justify-between pt-2 border-t border-outline-variant">
                <span class="font-bold text-on-surface">Tổng cộng</span>
                <span class="font-bold text-xl text-primary" id="totalPrice">0₫</span>
              </div>
            </div>
            <button class="w-full py-3 bg-primary text-on-primary rounded-lg font-bold text-base hover:bg-surface-tint transition-colors flex items-center justify-center gap-2" onclick="proceedToPayment()">
              <span class="material-symbols-outlined text-lg">check_circle</span> Xác nhận đặt hàng
            </button>
            <p class="text-xs text-secondary text-center mt-3">Bằng cách đặt hàng, bạn đã đồng ý với <span class="text-primary font-bold cursor-pointer">Điều khoản</span> của chúng tôi</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"><i class="ti ti-check"></i><span id="toastMsg"></span></div>

  <script>
    // Load cart from localStorage
    let cart = JSON.parse(localStorage.getItem('cart') || '[]');
    function showToast(msg) {
      const t = document.getElementById('toast');
      document.getElementById('toastMsg').textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2800);
    }
    function renderCheckoutCart() {
      const container = document.getElementById('checkoutCartItems');
      if (!cart.length) {
        container.innerHTML = '<p class="text-sm text-secondary text-center py-8">Giỏ hàng trống</p>';
        return;
      }
      container.innerHTML = cart.map((item, i) => `
        <div class="flex gap-3 pb-3">
          <div class="w-12 h-12 bg-surface-container rounded-lg flex items-center justify-center flex-shrink-0">
            <span class="material-symbols-outlined text-lg text-outline-variant">shopping_bag</span>
          </div>
          <div class="flex-1 min-w-0">
            <p class="text-xs font-semibold text-on-surface line-clamp-1">${item.name}</p>
            <p class="text-[11px] text-secondary">${item.size ? 'Size: ' + item.size + ' | ' : ''}x${item.qty}</p>
            <p class="text-xs font-bold text-primary">${(item.price * item.qty).toLocaleString('vi-VN')}₫</p>
          </div>
        </div>
      `).join('');
    }
    function calculateCheckoutTotals() {
      const subtotal = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
      const shipping = document.querySelector('input[name="shipping"]:checked').value === 'express' ? 30000 : 0;
      const discount = 0; // TODO: implement promo code
      const total = subtotal + shipping - discount;
      document.getElementById('subtotal').textContent = subtotal.toLocaleString('vi-VN') + '₫';
      document.getElementById('shippingCost').textContent = shipping > 0 ? '+' + shipping.toLocaleString('vi-VN') + '₫' : 'Miễn phí';
      document.getElementById('discountAmount').textContent = discount > 0 ? '-' + discount.toLocaleString('vi-VN') + '₫' : '0₫';
      document.getElementById('totalPrice').textContent = total.toLocaleString('vi-VN') + '₫';
    }
    function proceedToPayment() {
      const name = document.getElementById('checkoutName').value.trim();
      const phone = document.getElementById('checkoutPhone').value.trim();
      const address = document.getElementById('checkoutAddress').value.trim();
      const paymentMethod = document.querySelector('input[name="payment"]:checked').value;
      if (!name || !phone || !address) {
        showToast('Vui lòng điền đầy đủ thông tin giao hàng!');
        return;
      }
      showToast('Đang xử lý thanh toán...');
      setTimeout(() => {
        cart = [];
        localStorage.setItem('cart', '[]');
        showToast('Đặt hàng thành công! Cảm ơn bạn.');
        setTimeout(() => window.location.href = 'index.html', 1200);
      }, 1500);
    }
    // Populate user info if available
    window.onload = function() {
      const user = JSON.parse(localStorage.getItem('currentUser') || '{}');
      document.getElementById('checkoutName').value = user.name || '';
      document.getElementById('checkoutPhone').value = user.phone || '';
      document.getElementById('checkoutAddress').value = user.address || '';
      renderCheckoutCart();
      calculateCheckoutTotals();
      document.querySelectorAll('input[name="shipping"]').forEach(radio => {
        radio.addEventListener('change', calculateCheckoutTotals);
      });
    }
  </script>
</body>
</html>
